<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #15161b;
    --ink-panel: #1a1c22;
    --hairline: #2b2d35;
    --text: #ece7dd;
    --text-dim: #8b8d97;
    --amber: #c9975a;
    --amber-dim: #6b5a3f;
    --done: #7fae8b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(201, 151, 90, 0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(201, 151, 90, 0.04), transparent 45%);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 24px;
  }

  .panel {
    width: 100%;
    max-width: 400px;
  }

  .kicker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 0 0 18px;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 2.1rem;
    line-height: 1.15;
    margin: 0 0 12px;
    color: var(--text);
  }

  p.msg {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 400;
    font-size: 1.05rem;
    line-height: 1.5;
    color: var(--text-dim);
    margin: 0 0 32px;
    max-width: 38ch;
  }

  .timer-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    padding: 18px 0;
    margin-bottom: 28px;
  }

  .timer-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-dim);
  }

  .timer {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 2.4rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--amber);
    transition: color 0.4s ease;
  }

  .timer.done { color: var(--done); }

  .checklist {
    margin-bottom: 28px;
  }

  .checklist-heading {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin: 0 0 10px;
  }

  .checklist-loading, .checklist-error {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    color: var(--text-dim);
    padding: 4px 0;
  }

  .checklist-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--hairline);
    font-size: 0.92rem;
  }
  .checklist-item:last-child { border-bottom: none; }

  .checklist-item .mark {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    border: 1.5px solid var(--text-dim);
    position: relative;
  }
  .checklist-item.done .mark {
    border-color: var(--done);
    background: var(--done);
  }
  .checklist-item.done span.label {
    color: var(--text-dim);
    text-decoration: line-through;
    text-decoration-color: var(--hairline);
  }

  button#unlock {
    width: 100%;
    padding: 15px;
    background: transparent;
    border: 1.5px solid var(--amber-dim);
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.03em;
    cursor: not-allowed;
    transition: all 0.3s ease;
  }
  button#unlock.ready {
    border-color: var(--amber);
    color: var(--amber);
    cursor: pointer;
  }
  button#unlock.ready:hover {
    background: rgba(201, 151, 90, 0.08);
  }

  .dest {
    margin-top: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    opacity: 0.6;
    word-break: break-all;
  }
</style>
</head>
<body>
  <div class="panel">
    <p class="kicker">focus gate</p>
    <h1>Not yet.</h1>
    <p class="msg" id="customMsg">Keep pushing. That's the whole job right now.</p>

    <div class="timer-row">
      <span class="timer-label">holding</span>
      <span class="timer" id="timer">00:30</span>
    </div>

    <div class="checklist">
      <p class="checklist-heading">today</p>
      <div id="checklist">
        <div class="checklist-loading">loading…</div>
      </div>
    </div>

    <button id="unlock" disabled>tasks done</button>
    <div class="dest" id="destDisplay"></div>
  </div>

<script>
  // ---- config ----
  const DELAY_SECONDS = 30;
  const WORKER_URL = "https://misty-king-bfd9.davidyiemail.workers.dev/";

  // ---- read destination from query string ----
  const params = new URLSearchParams(window.location.search);
  let dest = params.get("dest") || params.get("url") || params.get("target");
  if (dest && !/^https?:\/\//i.test(dest)) {
    dest = "https://" + dest;
  }

  const destDisplay = document.getElementById("destDisplay");
  destDisplay.textContent = dest ? "→ " + dest : "";

  // ---- fetch today's checklist ----
  const checklistEl = document.getElementById("checklist");

  async function loadChecklist() {
    try {
      const res = await fetch(WORKER_URL);
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      if (!data.found) {
        checklistEl.innerHTML = '<div class="checklist-error">no entry for today yet</div>';
        return;
      }

      checklistEl.innerHTML = data.tasks
        .map(
          (t) => `
        <div class="checklist-item ${t.done ? "done" : ""}">
          <span class="mark"></span>
          <span class="label">${t.name}</span>
        </div>
      `
        )
        .join("");
    } catch (err) {
      checklistEl.innerHTML =
        '<div class="checklist-error">could not load tasks (' +
        String(err.message || err) +
        ")</div>";
    }
  }
  loadChecklist();

  // ---- countdown ----
  let remaining = DELAY_SECONDS;
  const timerEl = document.getElementById("timer");
  const unlockBtn = document.getElementById("unlock");

  function formatTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, "0");
    const sec = (s % 60).toString().padStart(2, "0");
    return m + ":" + sec;
  }

  timerEl.textContent = formatTime(remaining);

  const interval = setInterval(() => {
    remaining -= 1;
    if (remaining <= 0) {
      remaining = 0;
      clearInterval(interval);
      unlockBtn.disabled = false;
      unlockBtn.classList.add("ready");
      unlockBtn.textContent = "tasks done";
      timerEl.classList.add("done");
      timerEl.textContent = "00:00";
    } else {
      timerEl.textContent = formatTime(remaining);
    }
  }, 1000);

  // ---- unlock button ----
  unlockBtn.addEventListener("click", () => {
    if (unlockBtn.disabled) return;
    if (dest) {
      window.location.href = dest;
    } else {
      unlockBtn.textContent = "no destination found";
    }
  });
</script>
</body>
</html>
